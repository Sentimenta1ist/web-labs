<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<link rel="icon" href="<%= BASE_URL %>favicon.ico">
	<title>Elfo.POC.PdfGallery</title>
</head>

<body>
	<script src="<%= BASE_URL %>js/checkBrowser.js"></script>
	<noscript>
		<strong>
			We're sorry but clientapp doesn't work properly without JavaScript enabled. Please enable it to
			continue.
		</strong>
	</noscript>
	<div id="app"></div>
	<% if (NODE_ENV === 'development') { %>
	<!-- only loaded in dev time for HMR in IE/Edge -->
	<script src="<%= BASE_URL %>js/eventsource.js"></script>
	<% } %>
	<!-- built files will be auto injected -->
</body>

</html>
